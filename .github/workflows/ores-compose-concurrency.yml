name: ores-compose explicit concurrency canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORES_COMPOSE_SHA: b39251acef0130f3c5961f8abec13d53dc7e3737

jobs:
  concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.ORES_COMPOSE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: 1.95.0 }
      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$ORES_COMPOSE_SHA"
          cargo build --manifest-path source/Cargo.toml --locked --bin ores-compose
      - name: Explicit override admits two clusters and down stays NanoID-scoped
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/source/target/debug/ores-compose"
          root="$RUNNER_TEMP/concurrency"
          export ORES_COMPOSE_RUNTIME_DIR="$RUNNER_TEMP/ores-runtime"
          mkdir -p "$root/a" "$root/b"
          cat > "$root/a/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          # ores-compose-nano-id: OPTOSYNC_CANARY_A_001
          project: opto-a
          services:
            worker: { runtime: host, command: ["sleep", "30"] }
          YAML
          cat > "$root/b/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          # ores-compose-nano-id: OPTOSYNC_CANARY_B_001
          project: opto-b
          services:
            worker: { runtime: host, command: ["sleep", "30"] }
          YAML
          "$bin" up --skip-zed-pkg --skip-rpc-gen "$root/a/.ores-compose.yaml" >"$RUNNER_TEMP/a.log" 2>&1 &
          first=$!
          trap '"$bin" down "$root/a/.ores-compose.yaml" >/dev/null 2>&1 || true; "$bin" down "$root/b/.ores-compose.yaml" >/dev/null 2>&1 || true; kill "$first" "${second:-0}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 100); do
            test -d "$ORES_COMPOSE_RUNTIME_DIR/clusters" && test "$(find "$ORES_COMPOSE_RUNTIME_DIR/clusters" -name '*.cluster' -type f | wc -l)" -eq 1 && break
            sleep 0.1
          done
          "$bin" up --ignore-other-cluster --skip-zed-pkg --skip-rpc-gen "$root/b/.ores-compose.yaml" >"$RUNNER_TEMP/b.log" 2>&1 &
          second=$!
          for _ in $(seq 1 100); do
            test "$(find "$ORES_COMPOSE_RUNTIME_DIR/clusters" -name '*.cluster' -type f | wc -l)" -eq 2 && break
            sleep 0.1
          done
          test "$(find "$ORES_COMPOSE_RUNTIME_DIR/clusters" -name '*.cluster' -type f | wc -l)" -eq 2
          kill -0 "$first"
          kill -0 "$second"

          "$bin" down "$root/a/.ores-compose.yaml"
          wait "$first" || true
          kill -0 "$second"
          test "$(find "$ORES_COMPOSE_RUNTIME_DIR/clusters" -name '*.cluster' -type f | wc -l)" -eq 1

          "$bin" down "$root/b/.ores-compose.yaml"
          wait "$second" || true
          test -z "$(find "$ORES_COMPOSE_RUNTIME_DIR/clusters" -name '*.cluster' -type f -print -quit)"
          trap - EXIT
